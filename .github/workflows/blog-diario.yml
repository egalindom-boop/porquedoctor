name: Blog diario

on:
  schedule:
    - cron: '41 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar post con Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generar_post.py

      - name: Commit y push
        run: |
          git config user.name "blog-bot"
          git config user.email "bot@porquedoctor.com"
          git add -A
          git commit -m "Post diario automático $(date -u +%F)" || exit 0
          git pull --rebase -X ours origin main
          git push origin main
