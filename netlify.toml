[build]
  publish = "site"
  command = "python3 -m pip install --quiet pillow && python3 scripts/build.py"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
